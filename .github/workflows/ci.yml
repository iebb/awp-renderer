name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -m pip install Pillow
      - run: npm run test:png
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: artifacts/*.tgz
# Native parity runs on a maintainer's configured Mac, not a stock hosted runner.
